<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김비서 매출 분석</title>
  <style>
    :root {
      --bg: #f0f9ff;
      --card: #ffffff;
      --t1: #0f172a;
      --t2: #475569;
      --t3: #94a3b8;
      --border: #e2e8f0;
      --blue: #2563eb;
      --blue-lt: #eff6ff;
      --green: #16a34a;
      --green-lt: #f0fdf4;
      --teal: #0891b2;
      --header-grad: linear-gradient(135deg,#1e40af,#0891b2);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
      background: var(--bg);
      color: var(--t1);
      padding: 28px 24px 48px;
      min-height: 100vh;
    }

    /* ── Header ── */
    .page-header {
      background: var(--header-grad);
      border-radius: 20px;
      padding: 24px 28px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      color: #fff;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: rgba(255,255,255,0.85);
      font-size: 13px; font-weight: 700;
      text-decoration: none;
      background: rgba(255,255,255,0.15);
      padding: 7px 14px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.25);
      transition: background 0.2s;
      white-space: nowrap;
    }
    .back-link:hover { background: rgba(255,255,255,0.25); }
    .header-text h1 { font-size: 20px; font-weight: 900; letter-spacing: -0.02em; }
    .header-text p  { font-size: 12.5px; opacity: 0.75; margin-top: 3px; }
    .header-badge {
      margin-left: auto;
      display: flex; gap: 10px;
    }
    .hbadge {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 10px; padding: 8px 14px; text-align: center;
    }
    .hbadge-val { font-size: 18px; font-weight: 900; }
    .hbadge-lbl { font-size: 10.5px; opacity: 0.72; }

    /* ── Charts grid ── */
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    /* ── Chart card ── */
    .chart-card {
      background: var(--card);
      border-radius: 18px;
      padding: 22px 22px 18px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07);
      border: 1px solid var(--border);
    }
    .chart-card-title {
      display: flex; align-items: center; gap: 9px;
      margin-bottom: 16px;
    }
    .ctitle-icon {
      width: 34px; height: 34px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .ctitle-icon.blue  { background: var(--blue-lt); }
    .ctitle-icon.green { background: var(--green-lt); }
    .ctitle-text { font-size: 15px; font-weight: 800; color: var(--t1); }
    .ctitle-sub  { font-size: 11.5px; color: var(--t3); margin-top: 1px; }

    svg.chart { width: 100%; height: auto; display: block; overflow: visible; }

    /* ── Summary row ── */
    .summary-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }
    .sum-card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px 18px;
      border: 1px solid var(--border);
      box-shadow: 0 1px 8px rgba(0,0,0,0.05);
    }
    .sum-label { font-size: 11px; color: var(--t3); margin-bottom: 6px; font-weight: 600; letter-spacing: 0.04em; }
    .sum-value { font-size: 22px; font-weight: 900; color: var(--t1); line-height: 1.1; }
    .sum-value sub { font-size: 12px; font-weight: 500; color: var(--t2); vertical-align: baseline; }
    .sum-meta  { font-size: 11px; color: var(--t3); margin-top: 4px; }
    .sum-card.accent { background: var(--blue-lt); border-color: #bfdbfe; }
    .sum-card.accent .sum-value { color: var(--blue); }
    .sum-card.accent .sum-label { color: #3b82f6; }

    /* ── Tooltip ── */
    #tooltip {
      position: fixed; pointer-events: none;
      background: #0f172a; color: #fff;
      font-size: 12.5px; font-weight: 600;
      padding: 8px 12px; border-radius: 9px;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      opacity: 0; transition: opacity 0.15s;
      z-index: 999;
    }
    #tooltip .tt-label { font-size: 11px; opacity: 0.65; margin-bottom: 2px; }
    #tooltip .tt-value { color: #93c5fd; font-size: 14px; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="page-header">
    <a href="dashboard.html" class="back-link">← 대시보드</a>
    <div class="header-text">
      <h1>매출 분석 차트</h1>
      <p>2026년 1월 ~ 2월 · 매출데이터.csv 기반</p>
    </div>
    <div class="header-badge">
      <div class="hbadge">
        <div class="hbadge-val">7,101만</div>
        <div class="hbadge-lbl">누적 매출</div>
      </div>
      <div class="hbadge">
        <div class="hbadge-val">30건</div>
        <div class="hbadge-lbl">총 거래</div>
      </div>
    </div>
  </div>

  <!-- Charts -->
  <div class="charts-grid">

    <!-- 1. Line Chart -->
    <div class="chart-card">
      <div class="chart-card-title">
        <div class="ctitle-icon blue">📈</div>
        <div>
          <div class="ctitle-text">일별 매출 추이</div>
          <div class="ctitle-sub">1/5 ~ 2/10 (거래일 기준)</div>
        </div>
      </div>
      <svg id="lineChart" class="chart" viewBox="0 0 660 270"></svg>
    </div>

    <!-- 2. Bar Chart -->
    <div class="chart-card">
      <div class="chart-card-title">
        <div class="ctitle-icon green">📊</div>
        <div>
          <div class="ctitle-text">제품별 매출 비교</div>
          <div class="ctitle-sub">전체 기간 합산</div>
        </div>
      </div>
      <svg id="barChart" class="chart" viewBox="0 0 660 270"></svg>
    </div>

  </div>

  <!-- Summary -->
  <div class="summary-row">
    <div class="sum-card accent">
      <div class="sum-label">전체 누적 매출</div>
      <div class="sum-value">7,101<sub>만원</sub></div>
      <div class="sum-meta">1월 + 2월</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">1월 총매출</div>
      <div class="sum-value">4,650<sub>만원</sub></div>
      <div class="sum-meta">7거래일 · 21건</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">2월 총매출</div>
      <div class="sum-value">2,451<sub>만원</sub></div>
      <div class="sum-meta">3거래일 · 9건</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">베스트 제품</div>
      <div class="sum-value" style="font-size:18px">무선 이어폰</div>
      <div class="sum-meta">2,884만원 · 점유율 40.6%</div>
    </div>
  </div>

  <!-- Tooltip -->
  <div id="tooltip"><div class="tt-label" id="tt-label"></div><div class="tt-value" id="tt-value"></div></div>

  <script>
    /* ── helpers ── */
    const ns = 'http://www.w3.org/2000/svg';
    function el(tag, attrs = {}, txt) {
      const e = document.createElementNS(ns, tag);
      for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
      if (txt !== undefined) e.textContent = txt;
      return e;
    }
    function fmt(n) { return n.toLocaleString('ko-KR'); }
    function fmtM(n) { return (n / 10000).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',') + '만원'; }

    /* ── data ── */
    const daily = [
      { label:'1/5',  full:'1월 5일',  v:7075000  },
      { label:'1/8',  full:'1월 8일',  v:8413000  },
      { label:'1/12', full:'1월 12일', v:4135000  },
      { label:'1/15', full:'1월 15일', v:8122000  },
      { label:'1/19', full:'1월 19일', v:5060000  },
      { label:'1/22', full:'1월 22일', v:9029000  },
      { label:'1/26', full:'1월 26일', v:4665000  },
      { label:'2/1',  full:'2월 1일',  v:10110000 },
      { label:'2/5',  full:'2월 5일',  v:6195000  },
      { label:'2/10', full:'2월 10일', v:8202000  },
    ];

    const products = [
      { label:'무선 이어폰',    v:28836000, color:'#2563eb' },
      { label:'텀블러',         v:11525000, color:'#16a34a' },
      { label:'블루투스 스피커',v:9600000,  color:'#0891b2' },
      { label:'보조배터리',     v:9030000,  color:'#0284c7' },
      { label:'에코백',         v:6165000,  color:'#15803d' },
      { label:'무선 충전기',    v:5850000,  color:'#1d4ed8' },
    ];

    /* ── tooltip ── */
    const tip = document.getElementById('tooltip');
    const tipLabel = document.getElementById('tt-label');
    const tipValue = document.getElementById('tt-value');
    function showTip(e, label, value) {
      tipLabel.textContent = label;
      tipValue.textContent = fmtM(value);
      tip.style.opacity = '1';
      moveTip(e);
    }
    function moveTip(e) {
      tip.style.left = (e.clientX + 14) + 'px';
      tip.style.top  = (e.clientY - 36) + 'px';
    }
    function hideTip() { tip.style.opacity = '0'; }

    /* ═══════════════════════════════════
       LINE CHART
    ═══════════════════════════════════ */
    (function drawLine() {
      const svg  = document.getElementById('lineChart');
      const W=660, H=270;
      const pad  = { l:68, r:18, t:22, b:52 };
      const cW   = W - pad.l - pad.r;
      const cH   = H - pad.t - pad.b;
      const maxV = 11000000;
      const yTicks = [0, 2000000, 4000000, 6000000, 8000000, 10000000];

      /* defs: gradient for area fill & line */
      const defs = el('defs');
      const aGrad = el('linearGradient', { id:'areaGrad', x1:'0', y1:'0', x2:'0', y2:'1' });
      aGrad.appendChild(el('stop', { offset:'0%',   'stop-color':'#3b82f6', 'stop-opacity':'0.22' }));
      aGrad.appendChild(el('stop', { offset:'100%', 'stop-color':'#3b82f6', 'stop-opacity':'0.01' }));
      const lGrad = el('linearGradient', { id:'lineGrad', x1:'0', y1:'0', x2:'1', y2:'0' });
      lGrad.appendChild(el('stop', { offset:'0%',   'stop-color':'#1d4ed8' }));
      lGrad.appendChild(el('stop', { offset:'100%', 'stop-color':'#0891b2' }));
      defs.appendChild(aGrad); defs.appendChild(lGrad); svg.appendChild(defs);

      const toX = i => pad.l + (i / (daily.length - 1)) * cW;
      const toY = v => pad.t + cH - (v / maxV) * cH;

      /* grid & y-axis */
      yTicks.forEach(tick => {
        const y = toY(tick);
        svg.appendChild(el('line', { x1:pad.l, y1:y, x2:W-pad.r, y2:y,
          stroke: tick===0 ? '#cbd5e1' : '#f1f5f9',
          'stroke-width': tick===0 ? '1.5' : '1' }));
        const lbl = tick === 0 ? '0' : (tick/10000)+'만';
        svg.appendChild(el('text', { x: pad.l-8, y: y+4,
          'text-anchor':'end', 'font-size':'10', fill:'#94a3b8' }, lbl));
      });

      /* month divider between index 6 and 7 */
      const divX = (toX(6) + toX(7)) / 2;
      svg.appendChild(el('line', { x1:divX, y1:pad.t, x2:divX, y2:pad.t+cH,
        stroke:'#cbd5e1', 'stroke-width':'1', 'stroke-dasharray':'4 4' }));
      svg.appendChild(el('text', { x:divX-16, y:pad.t-6,
        'font-size':'10', fill:'#94a3b8' }, '1월'));
      svg.appendChild(el('text', { x:divX+4, y:pad.t-6,
        'font-size':'10', fill:'#0891b2', 'font-weight':'700' }, '2월 →'));

      /* smooth bezier path */
      const pts = daily.map((d,i) => ({ x:toX(i), y:toY(d.v), ...d }));
      function bezier(pts) {
        let d = `M ${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
        for (let i=1; i<pts.length; i++) {
          const t=0.38;
          const cp1x = pts[i-1].x + (pts[i].x - pts[i-1].x)*t;
          const cp2x = pts[i].x   - (pts[i].x - pts[i-1].x)*t;
          d += ` C ${cp1x.toFixed(1)},${pts[i-1].y.toFixed(1)} ${cp2x.toFixed(1)},${pts[i].y.toFixed(1)} ${pts[i].x.toFixed(1)},${pts[i].y.toFixed(1)}`;
        }
        return d;
      }
      const linePath = bezier(pts);
      const bottom   = pad.t + cH;

      /* area */
      svg.appendChild(el('path', {
        d: `${linePath} L ${pts[pts.length-1].x.toFixed(1)},${bottom} L ${pts[0].x.toFixed(1)},${bottom} Z`,
        fill:'url(#areaGrad)', stroke:'none'
      }));

      /* line */
      svg.appendChild(el('path', {
        d: linePath,
        fill:'none', stroke:'url(#lineGrad)',
        'stroke-width':'2.5', 'stroke-linecap':'round', 'stroke-linejoin':'round'
      }));

      /* dots + x labels + hover */
      pts.forEach((p,i) => {
        /* x label */
        svg.appendChild(el('text', {
          x: p.x, y: bottom+16,
          'text-anchor':'middle', 'font-size':'10', fill:'#64748b'
        }, p.label));

        /* outer hit area */
        const hitG = el('g', { style:'cursor:pointer' });

        const outer = el('circle', { cx:p.x, cy:p.y, r:'10', fill:'transparent' });
        const ring  = el('circle', { cx:p.x, cy:p.y, r:'5',
          fill:'#fff', stroke:'url(#lineGrad)', 'stroke-width':'2.5' });

        outer.addEventListener('mouseenter', e => { ring.setAttribute('r','7'); showTip(e, p.full, p.v); });
        outer.addEventListener('mousemove',  e => moveTip(e));
        outer.addEventListener('mouseleave', ()=> { ring.setAttribute('r','5'); hideTip(); });

        hitG.appendChild(ring); hitG.appendChild(outer);
        svg.appendChild(hitG);
      });
    })();

    /* ═══════════════════════════════════
       BAR CHART
    ═══════════════════════════════════ */
    (function drawBar() {
      const svg = document.getElementById('barChart');
      const W=660, H=270;
      const pad = { l:68, r:18, t:22, b:60 };
      const cW  = W - pad.l - pad.r;
      const cH  = H - pad.t - pad.b;
      const maxV= 30000000;
      const yTicks = [0, 5000000, 10000000, 15000000, 20000000, 25000000, 30000000];
      const n   = products.length;
      const grpW= cW / n;
      const barW= grpW * 0.60;
      const barGap = (grpW - barW) / 2;
      const bottom = pad.t + cH;

      /* defs: per-product gradients */
      const defs = el('defs');
      products.forEach((p,i) => {
        const g = el('linearGradient', { id:`bg${i}`, x1:'0', y1:'0', x2:'0', y2:'1' });
        g.appendChild(el('stop', { offset:'0%', 'stop-color':p.color }));
        g.appendChild(el('stop', { offset:'100%', 'stop-color':p.color, 'stop-opacity':'0.65' }));
        defs.appendChild(g);
      });
      svg.appendChild(defs);

      /* grid & y-axis */
      yTicks.forEach(tick => {
        const y = pad.t + cH - (tick/maxV)*cH;
        svg.appendChild(el('line', { x1:pad.l, y1:y, x2:W-pad.r, y2:y,
          stroke: tick===0 ? '#cbd5e1' : '#f1f5f9',
          'stroke-width': tick===0 ? '1.5' : '1' }));
        if (tick > 0) {
          const lbl = (tick/10000)+'만';
          svg.appendChild(el('text', { x:pad.l-7, y:y+4,
            'text-anchor':'end', 'font-size':'10', fill:'#94a3b8' }, lbl));
        } else {
          svg.appendChild(el('text', { x:pad.l-7, y:y+4,
            'text-anchor':'end', 'font-size':'10', fill:'#94a3b8' }, '0'));
        }
      });

      /* bars */
      products.forEach((p, i) => {
        const bH  = (p.v / maxV) * cH;
        const bX  = pad.l + i*grpW + barGap;
        const bY  = bottom - bH;

        /* bar group */
        const g = el('g', { style:'cursor:pointer' });

        /* bar rect */
        const rect = el('rect', {
          x: bX, y: bY, width: barW, height: bH,
          fill: `url(#bg${i})`,
          rx:'5', ry:'5'
        });

        /* value label on top */
        const vLbl = el('text', {
          x: bX + barW/2, y: bY - 5,
          'text-anchor':'middle', 'font-size':'10', fill:p.color,
          'font-weight':'700'
        }, ((p.v/10000)|0).toLocaleString()+'만');

        /* x label (two-line via tspan for long names) */
        const xLbl = el('text', { x: bX + barW/2, y: bottom + 14,
          'text-anchor':'middle', 'font-size':'10', fill:'#64748b' });
        const words = p.label.split(' ');
        if (words.length > 1) {
          const t1 = el('tspan', { x: bX+barW/2, dy:'0' }, words[0]);
          const t2 = el('tspan', { x: bX+barW/2, dy:'13' }, words[1]);
          xLbl.appendChild(t1); xLbl.appendChild(t2);
        } else {
          xLbl.textContent = p.label;
        }

        /* hover */
        g.addEventListener('mouseenter', e => {
          rect.setAttribute('opacity','0.88');
          showTip(e, p.label, p.v);
        });
        g.addEventListener('mousemove',  e => moveTip(e));
        g.addEventListener('mouseleave', ()=> { rect.setAttribute('opacity','1'); hideTip(); });

        g.appendChild(rect); g.appendChild(vLbl);
        svg.appendChild(g);
        svg.appendChild(xLbl);
      });
    })();
  </script>
</body>
</html>
