<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="200" viewBox="0 0 800 200">

  <style>
    .back-btn { cursor: pointer; }
    .back-btn rect { transition: fill 0.18s; }
    .back-btn:hover rect { fill: #c4b5fd; }
  </style>

  <defs>
    <!-- Drop shadow -->
    <filter id="shadow" x="-12%" y="-15%" width="124%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#00000014"/>
    </filter>

    <!-- Arrowhead marker -->
    <marker id="arr" markerWidth="9" markerHeight="7"
            refX="8" refY="3.5" orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L0,6.5 L8,3.5 Z" fill="#a0aec0"/>
    </marker>

    <!-- Connector dot marker -->
    <marker id="dot" markerWidth="6" markerHeight="6"
            refX="3" refY="3" orient="auto"
            markerUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.5" fill="#a0aec0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="#f8fafc" rx="14"/>

  <!-- Back to dashboard button -->
  <a href="dashboard.html" class="back-btn">
    <rect x="10" y="8" width="108" height="26" rx="13" ry="13"
          fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.2"/>
    <text x="64" y="21" text-anchor="middle" dominant-baseline="middle"
          font-size="11" font-weight="700" fill="#6d28d9"
          font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">← 대시보드</text>
  </a>

  <!-- ─────────────────────────────────────────
       STEP 1 — 기획  (파란)
  ───────────────────────────────────────── -->
  <rect x="40" y="60" width="120" height="80" rx="18" ry="18"
        fill="#dbeafe" stroke="#93c5fd" stroke-width="1.8"
        filter="url(#shadow)"/>
  <!-- number badge -->
  <circle cx="152" cy="68" r="10" fill="#3b82f6"/>
  <text x="152" y="72.5" text-anchor="middle" dominant-baseline="middle"
        font-size="10" font-weight="800" fill="#fff"
        font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">1</text>
  <!-- Korean label -->
  <text x="100" y="105" text-anchor="middle" dominant-baseline="middle"
        font-size="24" font-weight="900" fill="#1e40af"
        font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">기획</text>
  <!-- English sub -->
  <text x="100" y="128" text-anchor="middle"
        font-size="11" font-weight="600" fill="#60a5fa" letter-spacing="1"
        font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">Plan</text>

  <!-- Arrow 1 -->
  <line x1="165" y1="100" x2="187" y2="100"
        stroke="#a0aec0" stroke-width="2"
        marker-start="url(#dot)" marker-end="url(#arr)"/>

  <!-- ─────────────────────────────────────────
       STEP 2 — 제작  (초록)
  ───────────────────────────────────────── -->
  <rect x="190" y="60" width="120" height="80" rx="18" ry="18"
        fill="#dcfce7" stroke="#86efac" stroke-width="1.8"
        filter="url(#shadow)"/>
  <circle cx="302" cy="68" r="10" fill="#22c55e"/>
  <text x="302" y="72.5" text-anchor="middle" dominant-baseline="middle"
        font-size="10" font-weight="800" fill="#fff"
        font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">2</text>
  <text x="250" y="105" text-anchor="middle" dominant-baseline="middle"
        font-size="24" font-weight="900" fill="#14532d"
        font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">제작</text>
  <text x="250" y="128" text-anchor="middle"
        font-size="11" font-weight="600" fill="#4ade80" letter-spacing="1"
        font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">Create</text>

  <!-- Arrow 2 -->
  <line x1="315" y1="100" x2="337" y2="100"
        stroke="#a0aec0" stroke-width="2"
        marker-start="url(#dot)" marker-end="url(#arr)"/>

  <!-- ─────────────────────────────────────────
       STEP 3 — 검토  (노란)
  ───────────────────────────────────────── -->
  <rect x="340" y="60" width="120" height="80" rx="18" ry="18"
        fill="#fef9c3" stroke="#fde047" stroke-width="1.8"
        filter="url(#shadow)"/>
  <circle cx="452" cy="68" r="10" fill="#ca8a04"/>
  <text x="452" y="72.5" text-anchor="middle" dominant-baseline="middle"
        font-size="10" font-weight="800" fill="#fff"
        font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">3</text>
  <text x="400" y="105" text-anchor="middle" dominant-baseline="middle"
        font-size="24" font-weight="900" fill="#713f12"
        font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">검토</text>
  <text x="400" y="128" text-anchor="middle"
        font-size="11" font-weight="600" fill="#facc15" letter-spacing="1"
        font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">Review</text>

  <!-- Arrow 3 -->
  <line x1="465" y1="100" x2="487" y2="100"
        stroke="#a0aec0" stroke-width="2"
        marker-start="url(#dot)" marker-end="url(#arr)"/>

  <!-- ─────────────────────────────────────────
       STEP 4 — 배포  (주황)
  ───────────────────────────────────────── -->
  <rect x="490" y="60" width="120" height="80" rx="18" ry="18"
        fill="#ffedd5" stroke="#fdba74" stroke-width="1.8"
        filter="url(#shadow)"/>
  <circle cx="602" cy="68" r="10" fill="#f97316"/>
  <text x="602" y="72.5" text-anchor="middle" dominant-baseline="middle"
        font-size="10" font-weight="800" fill="#fff"
        font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">4</text>
  <text x="550" y="105" text-anchor="middle" dominant-baseline="middle"
        font-size="24" font-weight="900" fill="#7c2d12"
        font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">배포</text>
  <text x="550" y="128" text-anchor="middle"
        font-size="11" font-weight="600" fill="#fb923c" letter-spacing="1"
        font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">Deploy</text>

  <!-- Arrow 4 -->
  <line x1="615" y1="100" x2="637" y2="100"
        stroke="#a0aec0" stroke-width="2"
        marker-start="url(#dot)" marker-end="url(#arr)"/>

  <!-- ─────────────────────────────────────────
       STEP 5 — 분석  (보라)
  ───────────────────────────────────────── -->
  <rect x="640" y="60" width="120" height="80" rx="18" ry="18"
        fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.8"
        filter="url(#shadow)"/>
  <circle cx="752" cy="68" r="10" fill="#8b5cf6"/>
  <text x="752" y="72.5" text-anchor="middle" dominant-baseline="middle"
        font-size="10" font-weight="800" fill="#fff"
        font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">5</text>
  <text x="700" y="105" text-anchor="middle" dominant-baseline="middle"
        font-size="24" font-weight="900" fill="#4c1d95"
        font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">분석</text>
  <text x="700" y="128" text-anchor="middle"
        font-size="11" font-weight="600" fill="#a78bfa" letter-spacing="1"
        font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">Analyze</text>

</svg>
